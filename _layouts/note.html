---
layout: default
---

<article class="note-page persian-note" lang="fa" dir="rtl">

    <a class="back-link persian-back-link"
       href="{{ '/notes/' | relative_url }}">
        بازگشت به یادداشت‌ها
    </a>


    <header class="note-header">

        <div class="note-meta">

            {% if page.jalali_date %}
                <span>{{ page.jalali_date }}</span>
            {% endif %}

            {% if page.tags %}
                {% for tag in page.tags %}
                    <span dir="auto">{{ tag }}</span>
                {% endfor %}
            {% endif %}

        </div>


        <h1>{{ page.title }}</h1>


        {% if page.description %}
            <p class="intro">
                {{ page.description }}
            </p>
        {% endif %}

    </header>


    <div class="prose" lang="fa" dir="rtl">
        {{ content }}
    </div>

</article>
