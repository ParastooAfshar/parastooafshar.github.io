---
layout: default
---

<article
    class="project-page"
    lang="fa"
    dir="rtl"
>
    <a
        class="project-back-link"
        href="{{ '/projects/' | relative_url }}"
    >
        بازگشت به پروژه‌ها
    </a>

    <header class="project-header">
        <h1>{{ page.title }}</h1>

        {% if page.description %}
            <p>{{ page.description }}</p>
        {% endif %}
    </header>

    <div class="project-links">
    {% if page.github %}
        <a
            href="{{ page.github }}"
            target="_blank"
            rel="noopener"
        >
            GitHub ↗
        </a>
    {% endif %}

    {% if page.paper %}
        <a
            href="{{ page.paper }}"
            target="_blank"
            rel="noopener"
        >
            مقاله‌ی اصلی ↗
        </a>
    {% endif %}
</div>
</article>
