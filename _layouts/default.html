<!DOCTYPE html>
<html
    lang="{{ page.lang | default: 'en' }}"
    dir="{{ page.dir | default: 'ltr' }}"
    data-theme="light"
>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if page.title and page.title != "Home" %}
            {{ page.title }} ·
        {% endif %}
        {{ site.title }}
    </title>

    <meta
        name="description"
        content="{{ page.description | default: site.description | escape }}"
    >

    <meta name="color-scheme" content="light dark">

    <meta
        name="theme-color"
        content="#f7f5f1"
        id="theme-color-meta"
    >

    <meta
        property="og:type"
        content="{% if page.layout == 'note' %}article{% else %}website{% endif %}"
    >

    <meta
        property="og:title"
        content="{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.title }}"
    >

    <meta
        property="og:description"
        content="{{ page.description | default: site.description | escape }}"
    >

    <meta
        property="og:url"
        content="{{ page.url | absolute_url }}"
    >

    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");

            const systemPrefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            document.documentElement.dataset.theme =
                savedTheme ||
                (systemPrefersDark ? "dark" : "light");
        })();
    </script>

    <link
        rel="stylesheet"
        href="{{ '/style.css' | relative_url }}"
    >
</head>


<body>

    <a class="skip-link" href="#content">
        Skip to content
    </a>


    <header class="site-header">

        <nav
            class="navbar"
            aria-label="Main navigation"
        >

            <a
                class="brand"
                href="{{ '/' | relative_url }}"
                aria-label="Parastoo Afshar — Home"
            >
                AP
            </a>


            <div class="nav-right">

                <div class="nav-links">
                    <a href="{{ '/#research' | relative_url }}">
                        Research
                    </a>

                    <a href="{{ '/projects/' | relative_url }}">
                        Projects
                    </a>

                    <a href="{{ '/notes/' | relative_url }}">
                        Notes
                    </a>
                </div>


                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Switch color theme"
                >
                    <span
                        class="theme-symbol"
                        id="theme-symbol"
                        aria-hidden="true"
                    >
                        ☾
                    </span>

                    <span
                        class="theme-label"
                        id="theme-label"
                    >
                        Dark
                    </span>
                </button>

            </div>

        </nav>

    </header>


    <main id="content">
        {{ content }}
    </main>


    <footer class="site-footer">

        <div class="footer-inner">

            <p>
                © {{ 'now' | date: '%Y' }} Parastoo Afshar
            </p>

        </div>

    </footer>


    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>

</body>
</html>
