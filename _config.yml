title: "Parastoo Afshar"
description: "Personal academic website · Research notes on Large Language Models, Artificial Intelligence, and Software Engineering"
url: "https://parastooafshar.github.io"
baseurl: ""

github_url: "https://github.com/parastooafshar"
linkedin_url: ""
email: ""
